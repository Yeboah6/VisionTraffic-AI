{% extends "base.html" %}

{% block content %}
<main class="main-content min-h-screen pb-8">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="flex items-center justify-between px-6 py-4">
            <div class="flex items-center">
                <h1 class="text-xl font-semibold text-slate-800">Sensor Management</h1>
                <div class="ml-6 px-3 py-1 bg-slate-100 rounded-full text-sm text-slate-600">
                    {{ current_date }} • {{ current_time }}
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <div class="relative">
                    <input type="search" placeholder="Search..." class="w-64 pl-10 pr-4 py-2 bg-slate-100 rounded-full text-sm border-none focus:outline-none focus:ring-2 focus:ring-primary">
                    <div class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 flex items-center justify-center text-slate-500">
                        <i class="ri-search-line"></i>
                    </div>
                </div>

                <button class="relative w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center">
                    <div class="w-5 h-5 flex items-center justify-center text-slate-600">
                        <i class="ri-notification-3-line"></i>
                    </div>
                    <span class="absolute top-0 right-0 w-2.5 h-2.5 bg-red-500 rounded-full"></span>
                </button>

                <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center">
                    <div class="w-5 h-5 flex items-center justify-center text-slate-600">
                        <i class="ri-settings-4-line"></i>
                    </div>
                </button>
            </div>
        </div>
    </header>

    <header class="bg-white shadow-sm">
        <div class="flex items-center justify-between px-6 py-4">
            <h1 class="text-xl font-semibold text-slate-800"></h1>
            <a href="{{ url_for('sensor.addSensor') }}" class="px-4 py-2 bg-primary text-white rounded-button text-sm">
                <span>Add New Sensor</span>
            </a>
        </div>
    </header>

    <!-- Sensor List -->
    <div class="px-6 py-6">
        <div class="card">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead>
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">Sensor ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">Type</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">Location</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                        {% for sensor in sensors %}
                        <tr>
                            <td class="px-6 py-4">{{ sensor.id }}</td>
                            <td class="px-6 py-4">{{ sensor.type|capitalize }}</td>
                            <td class="px-6 py-4">
                                <a href="{{ url_for('locations.view', location_id=sensor.location.id) }}" class="text-primary hover:underline">
                                    {{ sensor.location.name }}
                                </a>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-1 text-xs rounded-full bg-emerald-100 text-emerald-800">Active</span>
                            </td>
                            <td class="px-6 py-4">
                                <a href="{{ url_for('sensors.edit', sensor_id=sensor.id) }}" class="mr-2 text-slate-500 hover:text-primary">
                                    <i class="ri-edit-line"></i>
                                </a>
                                <a href="{{ url_for('sensors.delete', sensor_id=sensor.id) }}" class="text-slate-500 hover:text-red-500">
                                    <i class="ri-delete-bin-line"></i>
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
{% endblock %}

{% extends "user-base.html" %}

{% block content %}

    {% include 'includes/user-header.html' %}

        <!-- Main Content -->
        <main class="main-content flex-1 p-6">
            <div class="max-w-4xl mx-auto">
                <!-- Header -->
                <div class="flex justify-between items-center mb-6" style="background-color: #fff; border-radius: 5px; padding:10px;">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-800">User Profile</h1>
                        <p class="text-sm text-slate-600">Manage your account settings</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Left Column - Profile Card -->
                    <div class="lg:col-span-1">
                        <div class="card p-6">
                            <div class="flex flex-col items-center">
                                <div class="relative">
                                    <div class="w-24 h-24 rounded-full bg-primary flex items-center justify-center text-white text-3xl font-bold">
                                        JD
                                    </div>
                                </div>
                                <h2 class="mt-4 text-xl font-bold text-slate-800">{{ user.username|capitalize }}</h2>
                                <p class="text-sm text-slate-600">{{ user.email }}</p>
                                
                                <!-- <div class="mt-4 flex items-center">
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                        <i class="ri-shield-keyhole-line mr-1"></i> Administrator
                                    </span>
                                </div> -->
                                
                                <div class="w-full mt-6 pt-4 border-t border-slate-200">
                                    <div class="space-y-3">
                                        <div class="flex items-center text-sm text-slate-600">
                                            <i class="ri-calendar-line mr-2"></i>
                                            <span>Joined {{ user.created_at|time_ago }}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right Column - Forms -->
                    <div class="lg:col-span-2">
                        <!-- Personal Information Card -->
                        <div class="card p-6">
                            <h3 class="font-semibold text-slate-800 mb-4">Personal Information</h3>
                            <form class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                                        <input type="text" value="{{ user.username}}" class="w-full px-3 py-2 border border-slate-300 rounded-button text-sm">
                                    </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                                    <input type="email" value="{{ user.email}}" class="w-full px-3 py-2 border border-slate-300 rounded-button text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                    <input type="password" value="" class="w-full px-3 py-2 border border-slate-300 rounded-button text-sm">
                                </div>
                                <div class="pt-4 flex justify-end">
                                    <button type="button" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-button text-sm mr-2">
                                        Cancel
                                    </button>
                                    <button type="button" class="px-4 py-2 bg-primary text-white rounded-button text-sm">
                                        Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    <script>
        const userMenuButton = document.getElementById('userMenuButton');
        const userMenu = document.getElementById('userMenu');
        
        // Toggle user menu
        userMenuButton.addEventListener('click', function(e) {
            e.stopPropagation();
            userMenu.classList.toggle('active');
        });
        
        // Close user menu when clicking elsewhere
        document.addEventListener('click', function() {
            userMenu.classList.remove('active');
        });
        
        // Prevent menu from closing when clicking inside it
        userMenu.addEventListener('click', function(e) {
            e.stopPropagation();
        });
    </script>
    

{% endblock%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Wave Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 1.1em;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .traffic-light-info {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }

        .traffic-light-info h4 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9em;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .info-label {
            font-weight: 600;
            color: #6c757d;
        }

        .info-value {
            color: #2c3e50;
        }

        .phase-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 10px;
            background: white;
        }

        .phase-item {
            padding: 8px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 4px;
            border-left: 4px solid #3498db;
        }

        .btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .section-title {
            font-size: 1.3em;
            color: #2c3e50;
            margin: 30px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }

        .emergency-link {
            background: #e74c3c;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .emergency-link:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🟢 Green Wave Scheduler</h1>
            <div class="subtitle">Manually schedule green waves for traffic optimization</div>
        </div>

        <div class="form-container">
            <a href="#" class="emergency-link" onclick="showEmergencyForm()">🚨 Schedule Emergency Vehicle Instead</a>

            <form id="greenWaveForm">
                <h2 class="section-title">Green Wave Details</h2>
                
                <div class="form-group">
                    <label for="green_wave_type">Green Wave Type:</label>
                    <select id="green_wave_type" name="green_wave_type" required>
                        <option value="EMERGENCY">🚨 Emergency Response</option>
                        <option value="MAINTENANCE">🛠️ Road Maintenance</option>
                        <option value="SPECIAL_EVENT">🎉 Special Event</option>
                        <option value="PUBLIC_TRANSPORT">🚌 Public Transport</option>
                        <option value="OTHER">🔧 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="scenario">Scenario:</label>
                    <select id="scenario" name="scenario" required onchange="loadScenarioTrafficLights()">
                        <option value="intersection">Complex Intersection</option>
                        <option value="accra">Highway Simulation</option>
                        <option value="test">Test Scenario</option>
                        <option value="default">Default Scenario</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="traffic_light_id">Traffic Light:</label>
                    <select id="traffic_light_id" name="traffic_light_id" required onchange="loadTrafficLightDetails()">
                        <option value="">Select a Traffic Light...</option>
                    </select>
                    <div id="trafficLightInfo" class="traffic-light-info" style="display: none;">
                        <h4>Traffic Light Details</h4>
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">Program ID:</span>
                                <span class="info-value" id="info-program-id">-</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Cycle Time:</span>
                                <span class="info-value" id="info-cycle-time">-</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Controlled Lanes:</span>
                                <span class="info-value" id="info-lanes">-</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Phases:</span>
                                <span class="info-value" id="info-phases">-</span>
                            </div>
                        </div>
                        <div class="phase-list" id="phase-list" style="display: none;">
                            <h5>Phase Details:</h5>
                            <div id="phases-container"></div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="edge">Edge (Optional):</label>
                    <input type="text" id="edge" name="edge" placeholder="e.g., E0, E1, E2">
                </div>

                <div class="form-group">
                    <label for="emergency_id">Link to Emergency (Optional):</label>
                    <select id="emergency_id" name="emergency_id">
                        <option value="">No emergency link</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" rows="3" placeholder="Describe the purpose of this green wave..."></textarea>
                </div>

                <h2 class="section-title">Timing Configuration</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="scheduled_start">Start Time (seconds from now):</label>
                        <input type="number" id="scheduled_start" name="scheduled_start" value="30" min="0" step="5" required>
                    </div>

                    <div class="form-group">
                        <label for="duration">Duration (seconds):</label>
                        <input type="number" id="duration" name="duration" value="30" min="5" max="120" step="5" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Quick Duration Presets:</label>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <button type="button" class="duration-preset" data-duration="15">15s</button>
                        <button type="button" class="duration-preset" data-duration="30">30s</button>
                        <button type="button" class="duration-preset" data-duration="45">45s</button>
                        <button type="button" class="duration-preset" data-duration="60">60s</button>
                    </div>
                </div>

                <button type="submit" class="btn">
                    🟢 Schedule Green Wave
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Scheduling green wave...</p>
            </div>

            <div id="scheduleResult"></div>
        </div>
    </div>

    <script>
        // Global variables
        let trafficLights = [];
        let activeEmergencies = [];

        // Initialize the form
        document.addEventListener('DOMContentLoaded', function() {
            loadTrafficLights();
            loadActiveEmergencies();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Duration preset buttons
            document.querySelectorAll('.duration-preset').forEach(button => {
                button.addEventListener('click', function() {
                    document.getElementById('duration').value = this.getAttribute('data-duration');
                });
            });

            // Form submission
            document.getElementById('greenWaveForm').addEventListener('submit', scheduleGreenWave);
        }

        async function loadTrafficLights() {
            try {
                const response = await fetch('/api/emergency/traffic-lights');
                const result = await response.json();
                
                if (result.success) {
                    trafficLights = result.traffic_lights;
                    const select = document.getElementById('traffic_light_id');
                    
                    // Clear existing options except the first one
                    while (select.options.length > 1) {
                        select.remove(1);
                    }
                    
                    // Add traffic lights to dropdown
                    trafficLights.forEach(tl => {
                        const option = document.createElement('option');
                        option.value = tl.traffic_light_id;
                        option.textContent = `${tl.traffic_light_id} (${tl.program_id})`;
                        select.appendChild(option);
                    });
                } else {
                    showError('Failed to load traffic lights: ' + result.error);
                }
            } catch (error) {
                showError('Network error loading traffic lights: ' + error.message);
            }
        }

        async function loadActiveEmergencies() {
            try {
                const response = await fetch('/api/emergency/active');
                const result = await response.json();
                
                if (result.success) {
                    activeEmergencies = result.emergencies;
                    const select = document.getElementById('emergency_id');
                    
                    // Clear existing options except the first one
                    while (select.options.length > 1) {
                        select.remove(1);
                    }
                    
                    // Add emergencies to dropdown
                    activeEmergencies.forEach(emergency => {
                        const option = document.createElement('option');
                        option.value = emergency.id;
                        option.textContent = `${emergency.vehicle_id} - ${emergency.emergency_type}`;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading emergencies:', error);
            }
        }

        async function loadTrafficLightDetails() {
            const tlId = document.getElementById('traffic_light_id').value;
            const infoDiv = document.getElementById('trafficLightInfo');
            
            if (!tlId) {
                infoDiv.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`/api/emergency/traffic-lights/${tlId}`);
                const result = await response.json();
                
                if (result.success) {
                    const tl = result.traffic_light;
                    
                    // Update info display
                    document.getElementById('info-program-id').textContent = tl.program_id || '-';
                    document.getElementById('info-cycle-time').textContent = tl.cycle_time ? `${tl.cycle_time}s` : '-';
                    document.getElementById('info-lanes').textContent = tl.controlled_lanes ? tl.controlled_lanes.length : '0';
                    document.getElementById('info-phases').textContent = tl.phases ? tl.phases.length : '0';
                    
                    // Display phase details
                    const phasesContainer = document.getElementById('phases-container');
                    const phaseList = document.getElementById('phase-list');
                    
                    if (tl.phases && tl.phases.length > 0) {
                        phasesContainer.innerHTML = '';
                        tl.phases.forEach((phase, index) => {
                            const phaseDiv = document.createElement('div');
                            phaseDiv.className = 'phase-item';
                            phaseDiv.innerHTML = `
                                <strong>Phase ${phase.index}:</strong> ${phase.name}<br>
                                <small>Duration: ${phase.duration}s | Type: ${phase.type}</small>
                            `;
                            phasesContainer.appendChild(phaseDiv);
                        });
                        phaseList.style.display = 'block';
                    } else {
                        phaseList.style.display = 'none';
                    }
                    
                    infoDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading traffic light details:', error);
                infoDiv.style.display = 'none';
            }
        }

        async function scheduleGreenWave(e) {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    const data = {
        scenario: formData.get('scenario'), // Add scenario field
        traffic_light_id: formData.get('traffic_light_id'),
        edge: formData.get('edge'),
        green_wave_type: formData.get('green_wave_type'),
        emergency_id: formData.get('emergency_id') || null,
        description: formData.get('description'),
        scheduled_start: parseFloat(formData.get('scheduled_start')) + Date.now()/1000,
        duration: parseFloat(formData.get('duration'))
    };

    // Validate required fields
    if (!data.scenario) {
        showError('Please select a scenario');
        return;
    }

    if (!data.traffic_light_id) {
        showError('Please select a traffic light');
        return;
    }

    // Show loading
    document.getElementById('loading').style.display = 'block';
    document.getElementById('scheduleResult').innerHTML = '';

    try {
        const response = await fetch('/api/emergency/green-wave/schedule', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        
        if (result.success) {
            showSuccess(`✅ ${result.message}<br><small>Green Wave ID: ${result.green_wave_id}</small>`);
            // Reset form but keep scenario
            const currentScenario = data.scenario;
            e.target.reset();
            document.getElementById('scenario').value = currentScenario;
            document.getElementById('trafficLightInfo').style.display = 'none';
        } else {
            showError(`❌ ${result.error}`);
        }
    } catch (error) {
        showError(`❌ Network error: ${error.message}`);
    } finally {
        document.getElementById('loading').style.display = 'none';
    }
}

        function showSuccess(message) {
            const resultDiv = document.getElementById('scheduleResult');
            resultDiv.innerHTML = `<div class="result success">${message}</div>`;
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function showError(message) {
            const resultDiv = document.getElementById('scheduleResult');
            resultDiv.innerHTML = `<div class="result error">${message}</div>`;
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function showEmergencyForm() {
            alert('Redirecting to Emergency Vehicle Scheduling form...');
            window.location.href = '/api/emergency/emergency-schedule';
        }

        // Style for duration preset buttons
        document.querySelectorAll('.duration-preset').forEach(button => {
            button.style.cssText = `
                padding: 8px 15px;
                background: #3498db;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: background 0.3s ease;
                flex: 1;
            `;
            button.addEventListener('mouseenter', function() {
                this.style.background = '#2980b9';
            });
            button.addEventListener('mouseleave', function() {
                this.style.background = '#3498db';
            });
        });

        async function loadScenarioTrafficLights() {
    const scenario = document.getElementById('scenario').value;
    if (!scenario) return;
    
    try {
        const response = await fetch(`/api/emergency/traffic-lights?scenario=${scenario}`);
        const result = await response.json();
        
        if (result.success) {
            const trafficLights = result.traffic_lights;
            const select = document.getElementById('traffic_light_id');
            
            // Clear existing options except the first one
            while (select.options.length > 1) {
                select.remove(1);
            }
            
            // Add traffic lights to dropdown
            trafficLights.forEach(tl => {
                const option = document.createElement('option');
                option.value = tl.traffic_light_id;
                option.textContent = `${tl.traffic_light_id} (${tl.program_id})`;
                select.appendChild(option);
            });
            
            // Reset traffic light info
            document.getElementById('trafficLightInfo').style.display = 'none';
        } else {
            showError('Failed to load traffic lights for scenario: ' + result.error);
        }
    } catch (error) {
        showError('Network error loading scenario traffic lights: ' + error.message);
    }
}

// Update the initial load function to use default scenario
async function loadTrafficLights() {
    const scenario = document.getElementById('scenario').value || 'intersection';
    await loadScenarioTrafficLights();
}
    </script>
</body>
</html>
